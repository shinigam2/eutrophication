# ==============================================================================
# Единый справочник озёр и настроек подсистемы сбора данных (Часть 1)
# ==============================================================================
# Принцип конфигурации (ADR-05 в DECISIONS.md):
# Чтобы добавить новое озеро (в том числе вживую на защите/опроцентовке),
# достаточно добавить один блок в список `water_bodies` ниже и запустить ETL:
#   python -m src.etl.osm_geometry --lake <id>
# Менять Python-код для новых водоёмов не требуется.
# ==============================================================================

pipeline:
  # Период выгрузки данных:
  # 2018-2019 гг. — для сверки и калибровки оптического переводчика с реальными
  #                 лабораторными таблицами БГУ (Нарочь, Мястро, Баторино);
  # 2020-2026 гг. — основной рабочий диапазон мониторинга и прогноза (+10 дней).
  start_date: "2018-01-01"
  end_date: "2026-11-15"

  # Параметры спутниковой обработки (Sentinel-2 L2A, AWS Earth Search STAC)
  stac_api_url: "https://earth-search.aws.element84.com/v1/search"
  stac_collection: "sentinel-2-l2a"
  max_scene_cloud_cover_pct: 40.0
  shore_buffer_m: 25.0          # Отступ внутрь от берега и островов (убираем камыш/отмель)
  min_valid_water_pixels: 20    # Минимум чистых водных пикселей (20м сетка, SCL == 6)
  min_water_coverage_pct: 30.0  # Минимум доли чистой воды внутри буферного контура (%)

  # Пороги санитарной тревоги по хлорофиллу-а (СанПиН РБ / ВОЗ)
  default_thresholds:
    attention_ug_l: 15.0        # Уровень внимания (мезотрофно-эвтрофный переход)
    bloom_ug_l: 25.0            # Опасное цветение (эвтрофный / гипертрофный риск)

# ------------------------------------------------------------------------------
# Список водоёмов-кандидатов (Нарочанская группа + Мядельская группа)
# Примечание: на Этапе 2 все 15 озёр проходят живой тест по реальным снимкам
# Sentinel-2 за лето 2026 г. Озёра с < 20 чистых пикселей воды после буфера
# отключаются (enabled: false) с фиксацией точной причины.
# ------------------------------------------------------------------------------
